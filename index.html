<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Master - 2 Jogadores</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#101827,#18233d);
  color:white;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:18px;
}
.box{
  width:100%;
  max-width:520px;
  background:#202b42;
  border-radius:20px;
  padding:24px;
  box-shadow:0 10px 35px #0008;
}
h1{text-align:center;margin-top:0}
input,button{
  width:100%;
  padding:14px;
  margin:7px 0;
  border:0;
  border-radius:12px;
  font-size:17px;
}
input{background:#fff;color:#111}
button{
  background:#4f7cff;
  color:white;
  font-weight:bold;
  cursor:pointer;
}
button:disabled{opacity:.5;cursor:not-allowed}
.secondary{background:#394867}
.answer{background:#34486f;text-align:left}
.answer.correct{background:#16834b}
.answer.wrong{background:#a83232}
.hidden{display:none}
.code{
  font-size:34px;
  letter-spacing:7px;
  text-align:center;
  font-weight:bold;
  background:#111a2b;
  padding:15px;
  border-radius:12px;
  margin:12px 0;
}
.status{text-align:center;min-height:25px;color:#dbe5ff}
.score{
  display:flex;
  justify-content:space-between;
  background:#111a2b;
  padding:12px;
  border-radius:12px;
  margin-bottom:15px;
}
.question{font-size:22px;font-weight:bold;margin:18px 0}
.small{text-align:center;color:#b8c2d9;font-size:14px}
</style>
</head>

<body>
<div class="box">

  <div id="inicio">
    <h1>🎯 Quiz Master</h1>
    <p class="small">Quiz online para 2 jogadores</p>

    <input id="nome" maxlength="20" placeholder="Seu nome">

    <button onclick="criarSala()">➕ Criar sala</button>

    <hr>

    <input id="codigoEntrada" maxlength="4" inputmode="numeric"
           placeholder="Código da sala (4 números)">
    <button class="secondary" onclick="entrarSala()">🚪 Entrar na sala</button>

    <p id="statusInicio" class="status"></p>
  </div>

  <div id="sala" class="hidden">
    <h1>🏠 Sala</h1>
    <p id="textoSala" class="status"></p>
    <div id="codigoSala" class="code">----</div>
    <p id="esperando" class="status">Esperando o outro jogador...</p>
    <button class="secondary" onclick="voltar()">Sair</button>
  </div>

  <div id="quiz" class="hidden">
    <div class="score">
      <span id="jogador1">Jogador 1: 0</span>
      <span id="jogador2">Jogador 2: 0</span>
    </div>

    <div id="vez" class="status"></div>
    <div id="perguntaNumero" class="small"></div>
    <div id="pergunta" class="question"></div>

    <div id="respostas"></div>
    <p id="statusQuiz" class="status"></p>
  </div>

  <div id="fim" class="hidden">
    <h1>🏆 Fim do Quiz!</h1>
    <div id="resultado" class="question"></div>
    <button onclick="location.reload()">🔄 Jogar novamente</button>
  </div>

</div>

<script>
const perguntas = [
  {
    pergunta:"Qual é o maior planeta do Sistema Solar?",
    respostas:["Terra","Marte","Júpiter","Netuno"],
    correta:2
  },
  {
    pergunta:"Qual é o maior oceano da Terra?",
    respostas:["Atlântico","Índico","Pacífico","Ártico"],
    correta:2
  },
  {
    pergunta:"Quanto é 12 × 5?",
    respostas:["50","55","60","65"],
    correta:2
  },
  {
    pergunta:"Qual planeta é conhecido como planeta vermelho?",
    respostas:["Marte","Vênus","Mercúrio","Netuno"],
    correta:0
  },
  {
    pergunta:"Qual é o símbolo químico do ouro?",
    respostas:["Ag","Au","Fe","O"],
    correta:1
  },
  {
    pergunta:"Qual é a raiz quadrada de 144?",
    respostas:["10","11","12","14"],
    correta:2
  },
  {
    pergunta:"Qual órgão bombeia o sangue pelo corpo?",
    respostas:["Pulmão","Cérebro","Coração","Fígado"],
    correta:2
  },
  {
    pergunta:"Qual é o maior país do mundo em território?",
    respostas:["Brasil","China","Rússia","Canadá"],
    correta:2
  }
];

let peer = null;
let conexao = null;
let souHost = false;
let meuNome = "";
let outroNome = "";
let jogador1 = "";
let jogador2 = "";
let pontos1 = 0;
let pontos2 = 0;
let perguntaAtual = 0;
let respondendo = false;
let minhaResposta = false;
let respostaRecebida = false;

function mostrar(id){
  document.getElementById(id).classList.remove("hidden");
}
function esconder(id){
  document.getElementById(id).classList.add("hidden");
}
function statusInicio(txt){
  document.getElementById("statusInicio").textContent = txt;
}
function statusQuiz(txt){
  document.getElementById("statusQuiz").textContent = txt;
}

function criarSala(){
  meuNome = document.getElementById("nome").value.trim() || "Jogador 1";
  souHost = true;

  // Código de 4 números.
  const codigo = String(Math.floor(1000 + Math.random()*9000));
  const id = "quiz-" + codigo;

  statusInicio("Criando sala...");

  peer = new Peer(id);

  peer.on("open", function(){
    document.getElementById("codigoSala").textContent = codigo;
    document.getElementById("textoSala").textContent =
      "Envie este código para o outro jogador:";
    esconder("inicio");
    mostrar("sala");
    statusInicio("");
  });

  peer.on("connection", function(conn){
    if(conexao) return;

    conexao = conn;

    conexao.on("open", function(){
      outroNome = (conexao.metadata && conexao.metadata.nome) || "Jogador 2";
      jogador1 = meuNome;
      jogador2 = outroNome;

      conexao.send({
        tipo:"inicio",
        nomeHost:meuNome,
        nomeConvidado:outroNome
      });

      document.getElementById("esperando").textContent =
        outroNome + " entrou! Começando...";
      setTimeout(iniciarQuizHost,800);
    });

    conexao.on("data", receberDados);
    conexao.on("close", jogadorSaiu);
  });

  peer.on("error", function(err){
    alert("Erro na sala: " + err.type);
    statusInicio("Não foi possível criar a sala.");
  });
}

function entrarSala(){
  meuNome = document.getElementById("nome").value.trim() || "Jogador 2";
  const codigo = document.getElementById("codigoEntrada").value.trim();

  if(!/^[0-9]{4}$/.test(codigo)){
    alert("Digite um código de 4 números.");
    return;
  }

  souHost = false;
  statusInicio("Entrando na sala...");

  peer = new Peer();

  peer.on("open", function(){
    conexao = peer.connect("quiz-" + codigo, {
      reliable:true,
      metadata:{nome:meuNome}
    });

    conexao.on("open", function(){
      esconder("inicio");
      mostrar("sala");
      document.getElementById("codigoSala").textContent = codigo;
      document.getElementById("textoSala").textContent =
        "Você entrou na sala.";
      document.getElementById("esperando").textContent =
        "Esperando o host iniciar o quiz...";
    });

    conexao.on("data", receberDados);
    conexao.on("close", jogadorSaiu);
  });

  peer.on("error", function(err){
    alert("Não foi possível entrar na sala. Confira o código.");
    statusInicio("Código inválido ou sala fechada.");
  });
}

function iniciarQuizHost(){
  perguntaAtual = 0;
  pontos1 = 0;
  pontos2 = 0;
  esconder("sala");
  mostrar("quiz");

  enviarEstado();
  mostrarPergunta();
}

function iniciarQuizConvidado(){
  esconder("sala");
  mostrar("quiz");
}

function enviarEstado(){
  if(!conexao) return;

  conexao.send({
    tipo:"pergunta",
    numero:perguntaAtual,
    pontos1:pontos1,
    pontos2:pontos2,
    jogador1:jogador1,
    jogador2:jogador2
  });
}

function mostrarPergunta(){
  const p = perguntas[perguntaAtual];

  document.getElementById("jogador1").textContent =
    jogador1 + ": " + pontos1;
  document.getElementById("jogador2").textContent =
    jogador2 + ": " + pontos2;

  document.getElementById("perguntaNumero").textContent =
    "Pergunta " + (perguntaAtual+1) + " de " + perguntas.length;

  document.getElementById("pergunta").textContent = p.pergunta;

  const area = document.getElementById("respostas");
  area.innerHTML = "";

  minhaResposta = false;
  respostaRecebida = false;
  respondendo = true;

  statusQuiz("Escolha uma resposta.");

  p.respostas.forEach((resp,index)=>{
    const btn = document.createElement("button");
    btn.className = "answer";
    btn.textContent = resp;
    btn.onclick = ()=>responder(index);
    area.appendChild(btn);
  });

  document.getElementById("vez").textContent =
    "Os dois podem responder!";
}

function responder(indice){
  if(!respondendo || minhaResposta) return;

  minhaResposta = true;

  document.querySelectorAll(".answer").forEach(b=>b.disabled=true);

  const acertou = indice === perguntas[perguntaAtual].correta;

  if(souHost){
    if(acertou) pontos1++;
    respostaRecebida = true;
    conexao.send({
      tipo:"resposta",
      indice:indice,
      acertou:acertou
    });
    verificarProxima();
  }else{
    if(acertou) pontos2++;

    conexao.send({
      tipo:"resposta",
      indice:indice,
      acertou:acertou
    });

    statusQuiz(acertou ? "✅ Você acertou!" : "❌ Você errou!");
  }
}

function verificarProxima(){
  if(!minhaResposta || !respostaRecebida) return;

  setTimeout(()=>{
    perguntaAtual++;

    if(perguntaAtual >= perguntas.length){
      finalizar();
      return;
    }

    enviarEstado();
    mostrarPergunta();
  },900);
}

function receberDados(data){
  if(!data || !data.tipo) return;

  if(data.tipo === "inicio"){
    jogador1 = data.nomeHost || "Jogador 1";
    jogador2 = data.nomeConvidado || meuNome;
    iniciarQuizConvidado();
  }

  if(data.tipo === "pergunta"){
    perguntaAtual = data.numero;
    pontos1 = data.pontos1;
    pontos2 = data.pontos2;
    jogador1 = data.jogador1 || jogador1;
    jogador2 = data.jogador2 || jogador2;

    mostrarPergunta();
  }

  if(data.tipo === "resposta" && souHost){
    respostaRecebida = true;

    if(data.acertou){
      pontos2++;
    }

    statusQuiz(data.acertou ? "O outro jogador acertou!" :
      "O outro jogador errou!");

    verificarProxima();
  }
}

function finalizar(){
  esconder("quiz");
  mostrar("fim");

  let resultado = "";

  if(pontos1 > pontos2){
    resultado = "🏆 " + jogador1 + " venceu!<br><br>" +
      pontos1 + " × " + pontos2;
  }else if(pontos2 > pontos1){
    resultado = "🏆 " + jogador2 + " venceu!<br><br>" +
      pontos2 + " × " + pontos1;
  }else{
    resultado = "🤝 Empate!<br><br>" +
      pontos1 + " × " + pontos2;
  }

  document.getElementById("resultado").innerHTML = resultado;
}

function jogadorSaiu(){
  alert("O outro jogador saiu da sala.");
  location.reload();
}

function voltar(){
  if(peer) peer.destroy();
  location.reload();
}
</script>
</body>
</html>
